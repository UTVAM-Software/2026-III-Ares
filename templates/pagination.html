{% if is_paginated %}<nav class="ares-pagination" aria-label="Páginas">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&{{ filter_query }}">Anterior</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&{{ filter_query }}">Siguiente</a>{% endif %}</nav>{% endif %}
