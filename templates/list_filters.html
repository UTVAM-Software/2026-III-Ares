<form method="get" class="ares-list-filters">
  {{ filters.non_field_errors }}
  {% for field in filters %}<div class="ares-form-group">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}
  <div><button type="submit" class="ares-btn ares-btn-primary">Filtrar</button> <a href="{{ request.path }}" class="ares-btn ares-btn-secondary">Limpiar</a></div>
</form>
